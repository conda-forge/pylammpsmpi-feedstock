schema_version: 1

context:
  name: pylammpsmpi
  version: 0.6.0
  python_min: '3.11'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pylammpsmpi-${{ version }}.tar.gz
  sha256: 24011cebb92c3645a8c0776616ed3ec3263b7bb0913d8c5566eca398f7970bec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - executorlib
    - mpi4py
    - numpy
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - mpi4py ==4.1.2
    - executorlib >=1.9.0,<1.12.0
    - numpy >=2.4.6,<2.6.0
tests:
  - python:
      imports:
        - pylammpsmpi
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: Parallel Lammps Python interface
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/pylammpsmpi

extra:
  recipe-maintainers:
    - pyiron-runner
    - jan-janssen
    - srmnitc
