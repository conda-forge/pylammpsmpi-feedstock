schema_version: 1

context:
  name: pylammpsmpi
  version: "0.5.3"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pylammpsmpi-${{ version }}.tar.gz
  sha256: 98c713fafa0cd0fcd4c9f3fa710df0f7d2cd1eb766e8d356a42f7a76023480a4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - executorlib
    - mpi4py
    - numpy
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - mpi4py >=4.1.2,<=4.1.2
    - executorlib >=1.9.0,<=1.10.4
    - numpy >=2.4.6,<=2.5.3
tests:
  - python:
      imports:
        - pylammpsmpi
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Parallel Lammps Python interface
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/pylammpsmpi

extra:
  recipe-maintainers:
    - pyiron-runner
    - jan-janssen
    - srmnitc
